name: Performance regression

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'benchmarks/**'
      - 'CMakeLists.txt'
      - '.github/workflows/performance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'include/**'
      - 'benchmarks/**'
      - 'CMakeLists.txt'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
    inputs:
      operations:
        description: Operations per production benchmark scenario
        required: true
        default: '200000'

permissions:
  contents: read

jobs:
  compare-baseline:
    name: candidate vs v0.3.0-beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          path: candidate
      - name: Checkout release baseline
        uses: actions/checkout@v5
        with:
          ref: v0.3.0-beta
          path: baseline
      - name: Install build tools
        run: candidate/.github/scripts/install-apt-packages.sh ninja-build
      - name: Configure and build both revisions
        run: |
          cmake -G Ninja -S baseline -B baseline/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=ON
          cmake --build baseline/build --parallel
          cmake -G Ninja -S candidate -B candidate/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=ON
          cmake --build candidate/build --parallel
      - name: Run seven alternating samples
        env:
          OPERATIONS: ${{ inputs.operations || '200000' }}
        run: |
          for sample in 1 2 3 4 5 6 7; do
            if (( sample % 2 )); then
              first=baseline
              second=candidate
            else
              first=candidate
              second=baseline
            fi
            "$first/build/MicroErrorSystemProductionBenchmark" \
              --profile=full --operations="$OPERATIONS" \
              --csv="$first-$sample.csv" >/dev/null
            "$second/build/MicroErrorSystemProductionBenchmark" \
              --profile=full --operations="$OPERATIONS" \
              --csv="$second-$sample.csv" >/dev/null
          done
      - name: Compare medians and enforce target
        run: >-
          python3 candidate/benchmarks/compare_versions.py
          --baseline 'baseline-*.csv'
          --candidate 'candidate-*.csv'
          --output comparison.md
          --minimum-dispatch-gain 5
          --maximum-dispatch-scenario-regression 15
          --maximum-subsystem-regression 12.5
      - name: Upload raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: version-performance-${{ github.run_id }}
          path: |
            baseline-*.csv
            candidate-*.csv
            comparison.md
          retention-days: 30
