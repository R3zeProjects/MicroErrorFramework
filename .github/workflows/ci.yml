name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-compilers:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: g++
            cxxflags: ''
          - name: Clang
            compiler: clang++
            cxxflags: -stdlib=libc++ -fexperimental-library
    env:
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.cxxflags }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: .github/scripts/install-apt-packages.sh ninja-build clang libc++-dev libc++abi-dev
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DBUILD_TESTING=ON
          -DBUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows-clang:
    name: Windows Clang
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_TESTING=ON
          -DBUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  public-api-contracts:
    name: Linux public API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: .github/scripts/install-apt-packages.sh ninja-build
      - name: Configure contracts only
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBUILD_BENCHMARKS=OFF
      - name: Build supported API cases
        run: >-
          cmake --build build --parallel
          --target MicroErrorSystemTests
          MicroErrorSystemUnifiedApiTests
          MicroErrorSystemNegativeApiTests
      - name: Test positive, negative and compile-fail contracts
        run: ctest --test-dir build -L api-contract --output-on-failure

  installed-package:
    name: Linux installed package contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: .github/scripts/install-apt-packages.sh ninja-build
      - name: Configure library-only package
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DBUILD_BENCHMARKS=OFF
      - name: Install package
        run: cmake --install build --prefix "$PWD/install"
      - name: Verify version and package boundary
        shell: bash
        run: |
          grep -F 'set(PACKAGE_VERSION "0.4.1")' \
            install/lib/cmake/vosp/vospConfigVersion.cmake
          if find install -type f \
            \( -iname '*benchmark*' -o -iname '*test*' \
               -o -name '*.exe' -o -name '*.a' -o -name '*.so' \) \
            -print -quit | grep -q .; then
            echo 'Installed package contains development-only artifacts.' >&2
            exit 1
          fi
      - name: Configure downstream consumer
        run: >-
          cmake -G Ninja
          -S tests/package_consumer
          -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/install"
      - name: Build and run downstream consumer
        run: |
          cmake --build consumer-build --parallel
          ./consumer-build/vosp_package_consumer

  address-undefined-sanitizers:
    name: Linux Clang ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
      LDFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: >-
          .github/scripts/install-apt-packages.sh
          clang-19 libclang-rt-19-dev ninja-build g++-14
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DBUILD_TESTING=ON
          -DBUILD_BENCHMARKS=ON
          -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: Linux Clang ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CXXFLAGS: -stdlib=libc++ -fexperimental-library
      LDFLAGS: -stdlib=libc++ -fexperimental-library
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: .github/scripts/install-apt-packages.sh clang ninja-build libc++-dev libc++abi-dev
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_TESTING=ON
          -DENABLE_THREAD_SANITIZER=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Concurrency contracts under TSan
        run: >-
          ctest --test-dir build
          -R 'ConcurrencyContractTests|WorkerPoolStressTests|LoggerTests'
          --output-on-failure

  fuzzing:
    name: Linux Clang LibFuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
      LDFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: >-
          .github/scripts/install-apt-packages.sh
          clang-19 libclang-rt-19-dev ninja-build g++-14
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DBUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run public-state fuzzing
        run: ./build/MicroErrorSystemFuzzer -runs=50000 -max_len=16384 -close_fd_mask=3

  valgrind:
    name: Linux Valgrind Memcheck and Helgrind
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Valgrind
        run: .github/scripts/install-apt-packages.sh valgrind ninja-build
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_HELGRIND_ANNOTATIONS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Memcheck
        run: >-
          valgrind --tool=memcheck --leak-check=full --show-leak-kinds=all
          --track-origins=yes --error-exitcode=1
          ./build/MicroErrorSystemConcurrencyContractTests
      - name: Helgrind
        run: |
          valgrind --tool=helgrind --fair-sched=yes --error-exitcode=1 \
            ./build/MicroErrorSystemLoggerTests
          valgrind --tool=helgrind --fair-sched=yes --error-exitcode=1 \
            ./build/MicroErrorSystemWorkerPoolHelgrindTests

  static-analysis:
    name: Linux clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CXXFLAGS: -stdlib=libc++ -fexperimental-library
      LDFLAGS: -stdlib=libc++ -fexperimental-library
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-tidy
        run: >-
          .github/scripts/install-apt-packages.sh
          clang clang-tidy ninja-build libc++-dev libc++abi-dev
      - name: Configure
        run: >-
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          -DBUILD_TESTING=ON
      - name: Analyze while building
        run: cmake --build build --parallel 2
